<style>
  :root{
    --bg:#12151C;
    --surface:#1A1E27;
    --surface-2:#20242F;
    --border:#2B303C;
    --text:#E9EBF0;
    --text-dim:#8A8F9C;
    --text-faint:#585D6A;
    --accent:#E7B44B;
    --accent-dim:#7A6530;
    --pos:#B7D94C;
    --pos-glow:rgba(183,217,76,0.18);
    --neg:#E2685A;
    --neg-glow:rgba(226,104,90,0.18);
    --warn:#E2685A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 400px at 50% -10%, rgba(231,180,75,0.08), transparent),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--text);
    font-family:'Noto Sans JP','Zen Kaku Gothic New',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  .wrap{ max-width:640px; margin:0 auto; padding:0 16px 64px; }

  /* header */
  header{ padding:28px 16px 18px; text-align:center; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.28em; color:var(--accent);
    text-transform:uppercase; margin:0 0 8px;
  }
  h1{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:900; font-size:26px; letter-spacing:0.04em;
    margin:0 0 6px; color:var(--text);
  }
  .sub{ font-size:12.5px; color:var(--text-dim); margin:0; }

  /* card base */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
  }
  section{ margin-top:16px; }
  h2{
    font-family:'Zen Kaku Gothic New',sans-serif;

  .icon-btn{
    flex:0 0 auto;

    transition:background .15s ease, transform .1s ease;

  .icon-btn:active{ transform:scale(0.94); }
  .add-store-row{ display:none; gap:8px; margin-top:8px; }
  .add-store-row.show{ display:flex; }

  /* tabs */
  .tab-nav{ display:flex; gap:8px; margin-top:16px; }
  .tab-nav{ flex-wrap:wrap; }
  .tab-btn{
    flex:1; min-width:0; height:42px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:12px;
    padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; transition:all .15s ease;
  }
  .tab-btn.active{
    background:linear-gradient(180deg, var(--accent), #C99730); color:#14171F; border-color:transparent;
  }

  /* date nav */
  .date-nav{ display:flex; align-items:center; gap:8px; }
  .date-display{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .date-display .d{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:15px; }
  .date-display .d .w{ color:var(--text-dim); font-weight:500; font-size:13px; margin-left:4px; }
  .date-display input[type="date"]{
    background:transparent; border:none; padding:0; width:auto; color:var(--text-faint); font-size:12px;
    cursor:pointer;
  }
  .today-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.05em;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; padding:0 12px; height:40px; cursor:pointer; white-space:nowrap;
  }

  /* unit chips (registration & quick pick) */
  .quick-label{ font-size:10.5px; color:var(--text-faint); margin-bottom:8px; letter-spacing:.02em; }
  .unit-chips{ display:flex; flex-direction:column; gap:8px; }
  .unit-chip{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:11px 10px 11px 12px; cursor:pointer; transition:border-color .15s ease;
  }
  .unit-chip:active{ border-color:var(--accent-dim); background:var(--surface-2); }
  .unit-chip.static{ cursor:default; }
  .unit-chip.static:active{ border-color:var(--border); background:var(--surface); }
  .unit-chip .cu{
    flex:0 0 auto; min-width:34px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--accent);
    background:var(--surface-2); border-radius:6px; padding:6px 8px;
  }
  .unit-chip .cm{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .unit-chip .cm-name{ font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unit-chip .cm-time{ font-size:10px; color:var(--text-faint); }
  .unit-chip .cdel{
    flex:0 0 auto; width:26px; height:26px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:12px; transition:all .15s ease;
  }
  .unit-chip .cdel.confirm{ background:var(--warn); color:#fff; font-size:9px; width:auto; padding:0 7px; }
  .unit-chip .cdel.locked{ opacity:.45; font-size:13px; }

  .quick-record-card{
    border-color:var(--accent-dim);
    background:linear-gradient(180deg, rgba(231,180,75,0.07), var(--surface));
    margin-bottom:10px;
  }
  .qr-eyebrow{ font-size:10px; color:var(--text-faint); letter-spacing:.05em; margin-bottom:3px; }
  .qr-title{ font-size:15px; font-weight:700; margin-bottom:12px; }
  .qr-title .qu{ color:var(--accent); font-family:'JetBrains Mono',monospace; margin-right:6px; }
  .qr-actions{ display:flex; gap:8px; margin-top:10px; }
  .qr-actions .add-entry-btn{ margin-top:0; }

  /* registration / entry form */
  .form-field{ margin-bottom:12px; }
  .form-field:last-of-type{ margin-bottom:0; }
  .checkbox-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);
    margin-bottom:12px; cursor:pointer; user-select:none;
  }
  .checkbox-row input[type="checkbox"]{
    width:17px; height:17px; accent-color:var(--accent); cursor:pointer;
  }
  label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:5px; letter-spacing:.02em; }
  .sign-toggle{ display:flex; gap:8px; margin-bottom:10px; }
  .sign-btn{
    flex:1; height:40px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; transition:all .15s ease;
  }
  .sign-btn.plus.active{ background:rgba(183,217,76,0.14); border-color:var(--pos); color:var(--pos); }
  .sign-btn.minus.active{ background:rgba(226,104,90,0.14); border-color:var(--neg); color:var(--neg); }
  .diff-input-wrap{ position:relative; }
  .diff-input-wrap input{
    font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:19px; height:46px; padding-right:40px; color:var(--pos);
  }
  .diff-input-wrap input.neg{ color:var(--neg); }
  .diff-input-wrap .suffix{
    position:absolute; right:14px; top:0; bottom:0; display:flex; align-items:center;
    font-size:13px; color:var(--text-faint); font-family:'Noto Sans JP',sans-serif; pointer-events:none;
  }
  .add-entry-btn{
    margin-top:12px; width:100%; height:46px;
    background:linear-gradient(180deg, var(--accent), #C99730);
    border:none; border-radius:8px;
    color:#14171F; font-weight:700; font-size:14.5px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .add-entry-btn:active{ transform:scale(0.98); }
  .add-entry-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* summary */
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .machine-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 14px 12px; position:relative; overflow:hidden;
  }
  .machine-card .mname{ font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:2px; word-break:break-all; }
  .machine-card .mcount{ font-size:11px; color:var(--text-faint); margin-bottom:8px; }
  .machine-card .mavg{
    font-size:24px; font-weight:700; letter-spacing:.01em; line-height:1;
  }
  .machine-card .mrange{ margin-top:8px; font-size:10.5px; color:var(--text-faint); display:flex; gap:10px; }
  .pos{ color:var(--pos); text-shadow:0 0 16px var(--pos-glow); }
  .neg{ color:var(--neg); text-shadow:0 0 16px var(--neg-glow); }
  .zero{ color:var(--text-dim); }
  .amt{ color:var(--accent); text-shadow:0 0 14px rgba(231,180,75,0.16); }

  /* entries list, grouped by machine */
  .entries-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .entries-header h2{ margin:0; }
  .entry-count{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); }
  .machine-group{ margin-bottom:16px; }
  .machine-group:last-child{ margin-bottom:0; }
  .machine-group-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px; padding-left:2px;
  }
  .machine-group-title .mg-count{ font-size:10.5px; color:var(--text-faint); font-weight:500; }
  .entries-list{ display:flex; flex-direction:column; gap:8px; }
  .entry-row{
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    padding:11px 12px; display:flex; align-items:center; gap:12px;
  }
  .entry-row .unit{
    flex:0 0 auto; width:40px; height:40px; border-radius:7px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family:'JetBrains Mono',monospace;
  }
  .entry-row .unit .n{ font-size:13px; font-weight:700; }
  .entry-row .unit .l{ font-size:8px; color:var(--text-faint); margin-top:1px; }
  .entry-row .mid{ flex:1; min-width:0; }
  .entry-row .diff{ font-size:18px; font-weight:700; flex:0 0 auto; }
  .del-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:7px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .del-btn.confirm{ background:var(--warn); border-color:var(--warn); color:#fff; font-size:10px; width:auto; padding:0 8px; }
  .del-btn.locked{ opacity:.45; cursor:default; }

  .empty{
    padding:28px 16px; text-align:center; color:var(--text-faint); font-size:12.5px;
    border:1px dashed var(--border); border-radius:var(--radius);
  }

  /* history */
  .history-toggle{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text-dim); font-size:12.5px; padding:12px 14px; text-align:left;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;
  }
  .history-toggle .car{ transition:transform .2s ease; color:var(--text-faint); }
  .history-toggle.open .car{ transform:rotate(180deg); }
  .history-list{ display:none; margin-top:8px; flex-direction:column; gap:6px; }
  .history-list.show{ display:flex; }
  .history-item{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-size:12.5px;
  }
  .history-item:active{ background:var(--surface-2); }
  .history-item .hc{ color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-size:11px; }
  .history-item.active{ border-color:var(--accent-dim); }

  /* data sharing */
  .share-note{ font-size:11.5px; color:var(--text-dim); margin:0 0 12px; line-height:1.6; }
  .share-actions{ display:flex; gap:8px; }
  .ghost-btn{
    flex:1; height:42px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700; font-size:13px; cursor:pointer; transition:all .15s ease;
  }
  .ghost-btn:active{ background:var(--surface); }
  .share-status{ margin-top:8px; font-size:11px; color:var(--text-faint); min-height:14px; }

  .no-store{ text-align:center; padding:48px 20px; color:var(--text-dim); font-size:13px; }
  .no-store .icon-btn{ margin:14px auto 0; }

  footer{ text-align:center; margin-top:28px; font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; letter-spacing:.05em; line-height:1.8; }
</style>

<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Pachinko Win Log</p>
    <h1>獲得枚数記録帳</h1>
    <p class="sub">店舗・日付ごとに台別の最大獲得枚数を記録</p>
  </header>

  <section class="store-select-section">
    <h2>店舗</h2>
    <div class="store-row">
      <select id="storeSelect"></select>
    </div>
  </section>

  <nav class="tab-nav">
    <button class="tab-btn active" id="tabRecord" data-view="record">記録</button>
    <button class="tab-btn" id="tabRecordsList" data-view="records">記録一覧</button>
    <button class="tab-btn" id="tabRegister" data-view="register">台の登録</button>
    <button class="tab-btn" id="tabSettings" data-view="settings">設定</button>
  </nav>

  <div id="mainArea"></div>

  <footer>DATA STORED LOCALLY ON THIS DEVICE ・ AUTO-DELETED AFTER 2 YEARS</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const STORAGE_KEY = 'pachinko-data';
const SYNC_CODE_KEY = 'pachinko-sync-code';
const RETENTION_YEARS = 2;
let state = { stores: [], units: [], records: [] };
let currentStore = null;
let currentView = 'record';
let currentDate = todayStr();
let openHistory = false;
let pendingDelete = null;
let pendingUnitDelete = null;
let quickTarget = null;
let quickSign = 'plus';

const ADMIN_PW_KEY = 'pachinko-admin-pw';
let adminUnlocked = false;

function getAdminPassword(){
  return localStorage.getItem(ADMIN_PW_KEY) || '';
}
function setAdminPasswordValue(pw){
  localStorage.setItem(ADMIN_PW_KEY, pw);
}

// ---- Firebase (optional realtime sync between devices) ----
// 1. Create a project at https://console.firebase.google.com
// 2. Add a Web App, enable Cloud Firestore (start in test mode, then tighten
//    the security rules to restrict access to known sync codes)
// 3. Paste the config values below (replace the placeholders)
const firebaseConfig = {
  apiKey: "AIzaSyA_6erxLO7alccBRjk5Qfpw5dQ4-Gs5Xls",
  authDomain: "pachislotdate.firebaseapp.com",
  projectId: "pachislotdate",
  storageBucket: "pachislotdate.firebasestorage.app",
  messagingSenderId: "1086239709695",
  appId: "1:1086239709695:web:d6c850d219800e6666efca"
};
let fbDb = null;
let fbUnsub = null;

function firebaseReady(){
  return typeof firebase !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY';
}
function initFirebase(){
  if(!firebaseReady() || fbDb) return;
  try{
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
  }catch(e){
    console.error('Firebase の初期化に失敗しました', e);
  }
}
function getSyncCode(){
  return localStorage.getItem(SYNC_CODE_KEY) || '';
}
function setSyncCode(code){
  if(code) localStorage.setItem(SYNC_CODE_KEY, code);
  else localStorage.removeItem(SYNC_CODE_KEY);
}
async function pullFromCloud(code){
  if(!fbDb || !code) return null;
  const snap = await fbDb.collection('syncCodes').doc(code).get();
  return snap.exists ? snap.data() : null;
}
async function pushToCloud(code, data){
  if(!fbDb || !code) return;
  try{
    await fbDb.collection('syncCodes').doc(code).set({ ...data, updatedAt: Date.now() });
  }catch(e){
    console.error('クラウドへの保存に失敗しました', e);
  }
}
function watchCloud(code){
  if(!fbDb || !code) return;
  if(fbUnsub){ fbUnsub(); fbUnsub = null; }
  fbUnsub = fbDb.collection('syncCodes').doc(code).onSnapshot((snap) => {
    if(!snap.exists) return;
    const data = snap.data();
    state.stores = data.stores || [];
    state.units = data.units || [];
    state.records = data.records || [];
    pruneOldRecords();
    if(state.stores.length && !state.stores.includes(currentStore)) currentStore = state.stores[0];
    renderStoreSelect();
    renderMain();
  });
}
async function activateSync(code){
  initFirebase();
  if(!fbDb) return false;
  try{
    const cloud = await pullFromCloud(code);
    if(cloud){
      state.stores = cloud.stores || [];
      state.units = cloud.units || [];
      state.records = cloud.records || [];
      pruneOldRecords();
    }else{
      await pushToCloud(code, { stores: state.stores, units: state.units, records: state.records });
    }
    watchCloud(code);
    return true;
  }catch(e){
    console.error('同期の開始に失敗しました', e);
    return false;
  }
}

function toIsoDate(d){
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function todayStr(){ return toIsoDate(new Date()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDiff(n){
  return Math.round(Math.abs(Number(n))).toLocaleString();
}
function diffClass(n){ return n > 0 ? 'pos' : (n < 0 ? 'neg' : 'zero'); }
function lastRecordTime(machine, unit){
  let latest = 0;
  storeRecords().forEach(r => {
    if(r.machine === machine && r.unit === unit && r.createdAt > latest) latest = r.createdAt;
  });
  return latest || null;
}
function relativeTime(ts){
  if(!ts) return null;
  const diffMs = Date.now() - ts;
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return 'たった今';
  if(diffMin < 60) return `${diffMin}分前`;
  const diffHour = Math.floor(diffMin / 60);
  if(diffHour < 24) return `${diffHour}時間前`;
  const diffDay = Math.floor(diffHour / 24);
  if(diffDay < 30) return `${diffDay}日前`;
  const diffMonth = Math.floor(diffDay / 30);
  if(diffMonth < 12) return `${diffMonth}ヶ月前`;
  const diffYear = Math.floor(diffDay / 365);
  return `${diffYear}年前`;
}
function fmtDateJP(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const w = ['日','月','火','水','木','金','土'][dt.getDay()];
  return { main: `${m}月${d}日`, week: `(${w})` };
}
function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return toIsoDate(dt);
}

function pruneOldRecords(){
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - RETENTION_YEARS);
  const cutoffStr = toIsoDate(cutoff);
  const before = state.records.length;
  state.records = state.records.filter(r => r.date >= cutoffStr);
  return state.records.length !== before;
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.stores = parsed.stores || [];
      state.units = parsed.units || [];
      state.records = parsed.records || [];
    }
  }catch(e){
    // no existing data yet, or storage unavailable in this environment
  }
  const changed = pruneOldRecords();
  if(state.stores.length && !currentStore){
    currentStore = state.stores[0];
  }
  if(changed) await save();
}
async function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ stores: state.stores, units: state.units, records: state.records }));
  }catch(e){
    console.error('保存に失敗しました', e);
  }
  const code = getSyncCode();
  if(code && fbDb){
    pushToCloud(code, { stores: state.stores, units: state.units, records: state.records });
  }
}

function storeRecords(){
  return state.records.filter(r => r.store === currentStore);
}
function dayRecords(){
  return storeRecords().filter(r => r.date === currentDate);
}
function storeUnits(){
  return state.units
    .filter(u => u.store === currentStore)
    .sort((a,b) => b.createdAt - a.createdAt);
}
function machineList(){
  const set = new Set(storeUnits().map(u => u.machine));
  return Array.from(set);
}
function compareUnits(a, b){
  const na = Number(a), nb = Number(b);
  const aNum = a !== '' && !Number.isNaN(na);
  const bNum = b !== '' && !Number.isNaN(nb);
  if(aNum && bNum) return na - nb;
  if(aNum) return -1;
  if(bNum) return 1;
  return a.localeCompare(b, 'ja');
}
function groupSortEntries(entries){
  const groups = {};
  entries.forEach(r => {
    if(!groups[r.machine]) groups[r.machine] = [];
    groups[r.machine].push(r);
  });
  return Object.keys(groups)
    .sort((a,b) => a.localeCompare(b, 'ja'))
    .map(name => ({
      machine: name,
      items: groups[name].slice().sort((a,b) => compareUnits(a.unit || '', b.unit || ''))
    }));
}

function renderStoreSelect(){
  const sel = document.getElementById('storeSelect');
  sel.innerHTML = '';
  if(!state.stores.length){
    const opt = document.createElement('option');
    opt.textContent = '店舗未登録';
    sel.appendChild(opt);
    sel.disabled = true;
  }else{
    sel.disabled = false;
    state.stores.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      if(s === currentStore) opt.selected = true;
      sel.appendChild(opt);
    });
  }
}

function renderMain(){
  const main = document.getElementById('mainArea');
  if(currentView === 'settings'){
    renderSettingsView(main);
    return;
  }
  if(!currentStore){
    main.innerHTML = `<div class="no-store">まだ店舗が登録されていません。<br>「設定」タブの管理者メニューから店舗を追加してください。</div>`;
    return;
  }
  if(currentView === 'register'){
    renderRegisterView(main);
  }else if(currentView === 'records'){
    renderRecordsListView(main);
  }else{
    renderRecordView(main);
  }
}

    const vals = groups[name];
    const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
    return { name, avg, count: vals.length, max: Math.max(...vals), min: Math.min(...vals) };

  const groupedEntries = groupSortEntries(entries);

async function handleRegisterUnit(){
  const unitInput = document.getElementById('regUnitInput');
  const endInput = document.getElementById('regUnitEndInput');
  const machineInput = document.getElementById('regMachineInput');
  const rangeToggle = document.getElementById('rangeToggle');
  const isRange = !!(rangeToggle && rangeToggle.checked);

  const unit = unitInput.value.trim();
  const machine = machineInput.value.trim();

  if(!machine){
    machineInput.style.borderColor = 'var(--warn)';
    setTimeout(() => { machineInput.style.borderColor = ''; }, 700);
    return;
  }

  if(isRange){
    const endRaw = endInput.value.trim();
    const startNum = Number(unit);
    const endNum = Number(endRaw);
    const invalid = unit === '' || endRaw === '' || Number.isNaN(startNum) || Number.isNaN(endNum);
    if(invalid){
      [unitInput, endInput].forEach(el => {
        el.style.borderColor = 'var(--warn)';
        setTimeout(() => { el.style.borderColor = ''; }, 700);
      });
      return;
    }
    const lo = Math.min(startNum, endNum);
    const hi = Math.max(startNum, endNum);
    if(hi - lo + 1 > 500){
      endInput.style.borderColor = 'var(--warn)';
      setTimeout(() => { endInput.style.borderColor = ''; }, 700);
      return;
    }
    let addedCount = 0;
    for(let n = lo; n <= hi; n++){
      const unitStr = String(n);
      const exists = storeUnits().some(u => u.unit === unitStr && u.machine === machine);
      if(!exists){
        state.units.push({ id: uid(), store: currentStore, unit: unitStr, machine, createdAt: Date.now() });
        addedCount++;
      }
    }
    if(addedCount > 0) await save();
    unitInput.value = '';
    endInput.value = '';
    machineInput.value = '';
    renderMain();
    return;
  }

  const exists = storeUnits().some(u => u.unit === unit && u.machine === machine);
  if(!exists){
    state.units.push({ id: uid(), store: currentStore, unit, machine, createdAt: Date.now() });
    await save();
  }
  unitInput.value = '';
  machineInput.value = '';
  renderMain();
}

function openQuickRecord(id){
  const u = state.units.find(x => x.id === id);
  if(!u) return;
  quickTarget = u;
  quickSign = 'plus';
  renderMain();
}

async function handleQuickSubmit(){
  const input = document.getElementById('quickAmountInput');
  const raw = input.value.trim();
  if(raw === ''){
    input.style.borderColor = 'var(--warn)';
    setTimeout(() => { input.style.borderColor = ''; }, 700);
    return;
  }
  const magnitude = Math.abs(Number(raw));
  if(Number.isNaN(magnitude)) return;
  const diff = quickSign === 'minus' ? -magnitude : magnitude;

  state.records.push({
    id: uid(),
    store: currentStore,
    date: currentDate,
    machine: quickTarget.machine,
    unit: quickTarget.unit,
    diff,
    createdAt: Date.now()
  });
  quickTarget = null;
  quickSign = 'plus';
  await save();
  renderMain();
}

function handleUnitDeleteClick(el){
  const id = el.dataset.del;
  if(pendingUnitDelete === id){
    state.units = state.units.filter(u => u.id !== id);
    if(quickTarget && quickTarget.id === id) quickTarget = null;
    pendingUnitDelete = null;
    save();
    renderMain();
  }else{
    pendingUnitDelete = id;
    el.classList.add('confirm');
    el.textContent = '削除';
    setTimeout(() => {
      if(pendingUnitDelete === id){
        pendingUnitDelete = null;
        renderMain();
      }
    }, 2500);
  }
}

function handleDeleteClick(el){
  const id = el.dataset.id;
  if(pendingDelete === id){
    state.records = state.records.filter(r => r.id !== id);
    pendingDelete = null;
    save();
    renderMain();
  }else{
    pendingDelete = id;
    el.classList.add('confirm');
    el.textContent = '削除';
    setTimeout(() => {
      if(pendingDelete === id){
        pendingDelete = null;
        renderMain();
      }
    }, 2500);
  }
}

      stores: state.stores, units: state.units, records: state.records,
      exportedAt: new Date().toISOString()
    }, null, 2);
    const filename = `pachinko-data-${todayStr()}.json`;
    try{
      const file = new File([payload], filename, { type: 'application/json' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: '獲得枚数記録データ' });
        showShareStatus('共有しました');
        return;
      }
    }catch(e){
      // fall through to download
    }
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showShareStatus('書き出しました');
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      (data.stores || []).forEach(s => { if(!state.stores.includes(s)) state.stores.push(s); });
      (data.units || []).forEach(u => { if(!state.units.some(x => x.id === u.id)) state.units.push(u); });
      (data.records || []).forEach(r => { if(!state.records.some(x => x.id === r.id)) state.records.push(r); });
      pruneOldRecords();
      await save();
      if(state.stores.length && !currentStore) currentStore = state.stores[0];
      renderStoreSelect();
      showShareStatus('読み込みが完了しました');
    }catch(err){
      showShareStatus('読み込みに失敗しました。ファイルを確認してください');
    }
  });

  document.getElementById('syncEnableBtn').addEventListener('click', async () => {
    const val = document.getElementById('syncCodeInput').value.trim();
    if(!val){
      setSyncCode('');
      if(fbUnsub){ fbUnsub(); fbUnsub = null; }
      showShareStatus('同期を解除しました');
      return;
    }
    if(!firebaseReady()){
      showShareStatus('Firebase が未設定です。index.html 内の firebaseConfig を入力してください');
      return;
    }
    setSyncCode(val);
    showShareStatus('同期を確認しています…');
    const ok = await activateSync(val);
    if(ok){
      renderStoreSelect();
      showShareStatus('同期を有効にしました');
    }else{
      showShareStatus('同期に失敗しました。設定をご確認ください');
    }
  });
}

async function init(){
  await load();
  renderStoreSelect();
  renderMain();

  const savedCode = getSyncCode();
  if(savedCode && firebaseReady()){
    const ok = await activateSync(savedCode);
    if(ok){
      renderStoreSelect();
      renderMain();
    }
  }
}
init();
</script>
</body>
</html>
